    <body class="login-page">
      <header>

      </header>
      <main>
      <div class="account-page-wrapper">
        <div class="form-container">
          <h2 >Logg inn</h2>
         <form id ="accountForm">
          <div class="form-group">
            <label for="username">Brukernavn</label>
             <input type="text" placeholder="Brukernavn" id="email" required>
          </div>
          <div class="form-group">
          <label for="password">Passord</label>
          <input type="password" placeholder="Passord" id="password" required>
          </div>
         <div class="button-group">
          <button type="button" id="loginBtn" class="btn btn-primary">Logg inn</button>
          <button type="button" id="registrer" class="btn btn-secondary">Registrer deg</button>
          <button onclick="toggleDarkMode()">🌙</button> 
         </div> 
         </form>
        </div>
      </div>
    </main>
   </body>
