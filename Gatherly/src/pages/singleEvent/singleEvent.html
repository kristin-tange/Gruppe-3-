<!DOCTYPE html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Arrangementinformasjon" />
    <meta name="author" content="Kristin Tange" />
    <link rel="stylesheet" href="/Gatherly/src/css/style.css" />
    <link rel="stylesheet" href="/Gatherly/src/css/singleEvent.css" />

    <!-- ROBOTO-FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Public+Sans:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <title>Arrangementinformasjon</title>
  </head>
  <body>
    <header></header>

    <!-- HERO -->
    <div id="hero-container"></div>
    <!-- <div class="event-capacity">
            <div id="capacity-img">
              <img
                src="/Gatherly/public/assets/icons/capacity.svg"
                width="24px"
                alt="Antall plasser"
              />
              <p id="capacity-counter">x/x</p>
            </div>
          </div> -->

    <main>
      <div id="description-container">
        <!-- INFORMASJON OM ARRANGEMENT -->
      </div>

      <!-- INNLEGG -->
      <section class="posts section-grid">
        <h3>Noe på hjertet?</h3>
        <p class="post-info">
          Skriv et innlegg til arrangøren eller andre som er interessert i dette
          arrangementet.
        </p>
        <button id="open-overlay-btn" class="btn btn-secondary" type="button">
          <span id="create-post">Opprett innlegg</span>
          <img src="/Gatherly/public/assets/icons/pil.svg" />
        </button>

        <h4>Innlegg <span id="post-counter" class="highlight">1</span></h4>

        <!-- HER KOMMER POSTEDE INNLEGG -->
        <div id="post-container"></div>

        <!-- OVERLAY: CREATE POST  -->
        <aside id="post-overlay" aria-label="Opprett innlegg">
          <form id="overlay-content" class="form-container">
            <button
              id="close-btn"
              class="btn btn-secondary"
              type="button"
              aria-label="Lukk vindu"
            >
              <img
                src="/Gatherly/public/assets/icons/close.png"
                alt="Lukk vindu"
                width="10px"
              />
            </button>
            <h3>Opprett innlegg</h3>
            <label for="post-name">Tittel:</label>
            <input
              type="text"
              id="post-name"
              name="post-name"
              class="input-style"
            />
            <label for="post-txt">Ditt innlegg:</label>
            <textarea
              id="post-txt"
              name="text"
              class="input-style"
              rows="6"
            ></textarea
            ><br />
            <button id="publish-btn" class="btn btn-primary" type="submit">
              Publiser
            </button>
          </form>
        </aside>
      </section>
    </main>

    <!-- FOOTER -->
    <footer>
      <p class="left"></p>
      <p class="center">© Gatherly 2026</p>

      <nav class="right" aria-label="Linker til sosiale medier">
        <a href="https://www.facebook.com" target="_blank">
          <img
            src="/Gatherly/public/assets/icons/facebook.png"
            alt="Facebook"
            class="icon"
          />
        </a>
        <a href="https://www.instagram.com" target="_blank">
          <img
            src="/Gatherly/public/assets/icons/instagram.png"
            alt="Instagram"
            class="icon"
          />
        </a>
        <a href="mailto:post@gatherly.no">
          <img
            src="/Gatherly/public/assets/icons/mail.png"
            alt="E-post"
            class="icon"
          />
        </a>
      </nav>
    </footer>

    <script type="module" src="/Gatherly/src/js/header.js"></script>
    <script type="module" src="/Gatherly/src/js/burger.js"></script>
    <script type="module" src="/Gatherly/src/js/singleEvent.js"></script>
  </body>
</html>
