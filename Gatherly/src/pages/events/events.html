<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/Gatherly/src/css/style.css" />
    <link rel="stylesheet" href="/Gatherly/src/css/events.css" />

    <!-- ROBOTO-FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Public+Sans:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="shortcut icon"
      href="./public/assets/icons/logo.png"
      type="image/x-icon"
    />
    <title>Gatherly</title>
  </head>
  <body>
    <header></header>

    <main>
      <div id="filterContainer">
        <button id="filterAll" class="category">All</button>
        <button id="filterAcademia" class="category">Academic</button>
        <button id="filterEntertainment" class="category">Entertainment</button>
        <button id="filterProfessional" class="category">Professional</button>
        <button id="filterLiterature" class="category">Literature</button>
        <button id="filterTechnology" class="category">Technology</button>
        <button id="filterSports" class="category">Sports</button>
      </div>
      <section id="events-container"></section>
    </main>
    <footer>
      <p class="left"></p>
      <p class="center">© Gatherly 2026</p>

      <nav class="right" aria-label="Linker til sosiale medier">
        <a href="https://www.facebook.com" target="_blank">
          <img
            src="/Gatherly/public/assets/icons/facebook.png"
            alt="Facebook"
            class="icon"
          />
        </a>
        <a href="https://www.instagram.com" target="_blank">
          <img
            src="/Gatherly/public/assets/icons/instagram.png"
            alt="Instagram"
            class="icon"
          />
        </a>
        <a href="mailto:post@gatherly.no">
          <img
            src="/Gatherly/public/assets/icons/mail.png"
            alt="E-post"
            class="icon"
          />
        </a>
      </nav>
    </footer>
    <script src="/Gatherly/src/js/header.js"></script>
    <script src="/Gatherly/src/js/burger.js"></script>
    <script src="header.js"></script>
  </body>
</html>
