<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Profile</title>

    <!-- ROBOTO-FONT -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Public+Sans:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../../src/css/style.css" />
    <link rel="stylesheet" href="../../../src/css/profileandlogin.css" />

    <!-- Favicon -->
    <link
      rel="shortcut icon"
      href="../../../public/assets/icons/logo.png"
      type="image/x-icon"
    />
  </head>

  <body>
    <header></header>    
    
    <main>
      <div class="account-page-wrapper">
        <div class="form-container">
          <h2 class="name">profilside</h2>
          <div class="profile-picture-wrapper">
            <img
              src="../../../public/assets/img/profilepicture.png"
              class="profile-picture"
              alt="Profilbilde"
            />
          </div>

          <form id="accountForm">
            <div class="form-group">
              <label for="firstname">Fornavn</label>
              <input aria-label="firstname" type="text" id="firstname" />
            </div>
            <div class="form-group">
              <label for="lastname">Etternavn</label>
              <input aria-label="Etternavn" type="text" id="lastname" />
            </div>
            <div class="form-group">
              <label for="phone">Telefonnummer</label>
              <input aria-label="Telefonnummer" type="tel" id="phone" />
            </div>
            <div class="form-group">
              <label for="location">Sted</label>
              <input aria-label="Sted" type="text" id="location" />
            </div>
            <div class="form-group">
              <label for="email">E-post</label>
              <input aria-label="E-post" type="email" id="email" />
            </div>
            <div class="form-group">
              <label for="password">passord</label>
              <input
                type="password"
                id="password"
                name="password"
                aria-label="Password"
                required
              />
            </div>
            <div class="form-group">
              <label for="alder">Alder</label>
              <input aria-label="age" type="number" id="age" />
            </div>
            <div class="form-group">
              <label for="description">Beskrivelse</label>
              <input aria-label="description" id="description" />
            </div>
            <div class="button-group">
              <button type="button" id="editbtn" class="btn btn-secondary">
                Rediger Profil
              </button>
              <button type="button" id="deletebtn" class="btn btn-secondary">
                Slett konto
              </button>
              <button type="button" id="savebtn" class="btn btn-primary">
                lagre endringer
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <footer>
      <p class="left"></p>

      <p class="center">© Gatherly 2026</p>

      <nav class="right" aria-label="Linker til sosiale medier">
        <a
          href="https://www.facebook.com"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            src="../../../public/assets/icons/facebook.png"
            class="icon"
            alt="Facebook"
          />
        </a>
        <a
          href="https://www.instagram.com"
          target="_blank"
          rel="noopener noreferrer"
        >
          <img
            src="../../../public/assets/icons/instagram.png"
            alt="Instagram"
            class="icon"
          />
        </a>
        <a href="mailto:post@gatherly.no">
          <img
            src="../../../public/assets/icons/mail.png"
            alt="E-post"
            class="icon"
          />
        </a>
      </nav>
    </footer>
    <script src="../../../src/js/header.js" ></script>
    <script src="../../../src/js/burger.js" ></script>
    <script src="../../../src/js/userprofile.js"></script>
  </body>
</html>
