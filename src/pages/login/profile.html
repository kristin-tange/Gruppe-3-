<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Profile</title>

    <!-- ROBOTO-FONT -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Public+Sans:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/css/style.css" />
    <link rel="stylesheet" href="/src/pages/login/profileandlogin.css" />

    <!-- Favicon -->
    <link
      rel="shortcut icon"
      href="/assets/icons/logo.png"
      type="image/x-icon"
    />
  </head>

  <body>
    <header></header>

    <main>
      <div class="account-page-wrapper">
        <div class="form-container">
          <h1 class="name" id="usernameTitle">profilside</h1>
          <div class="profile-picture-wrapper">
            <img
              id="image"
              src="/assets/img/welcomeimage.jpeg"
              alt="Profile Picture"
              class="profile-picture"
            />
          </div>

          <form id="accountForm">
            <div class="form-group">
              <label for="firstname">Fornavn</label>
              <input
                aria-label="firstname"
                type="text"
                placeholder="Fornavn"
                id="firstname"
              />
            </div>
            <div class="form-group">
              <label for="lastname">Etternavn</label>
              <input
                aria-label="Etternavn"
                type="text"
                placeholder="Etternavn"
                id="lastname"
              />
            </div>

            <div class="form-group">
              <label for="username">Brukernavn</label>
              <input
                aria-label="Brukernavn"
                type="text"
                placeholder="Brukernavn"
                id="username"
              />
            </div>
            <div class="form-group">
              <label for="email">E-post</label>
              <input
                aria-label="E-post"
                type = "email" name="user_email"
                placeholder= "E-post"
                id = "email"
                />
             </div>
            <div id="passwordGroup" class="form-group">
              <label for="password">passord</label>
              <input
                type="password"
                name="password" minlength="8"
                placeholder="Password"
                id="password"
                aria-label="Password"
              />
            </div>
          
            <div class="form-group">
              <label for="description">Beskrivelse</label>
              <input
                aria-label="description"
                placeholder="Hva vil du at andre skal vite om deg?"
                id="description"
              />
              </div>
          
            <div class="gender-group">
              <label class="gender-option">
                <input type="radio" name="gender" value="male" /> Mann
              </label>
              <label class="gender-option">
                <input type="radio" name="gender" value="female" /> Kvinne
              </label>
            </div>
          
            <div class="button-group">
              <button type="button" id="editbtn" class="btn btn-secondary">
                rediger Profil
              </button>
              <button type="button" id="deletebtn" class="btn btn-secondary">
                slett konto
              </button>
              <button type="submit" id="savebtn" class="btn btn-primary">
                lagre 
              </button>
            </div>
          
          </form>
      </div>
      </div>
    </main>
    <footer></footer>
    <script type="module" src="/src/components/header/header.ts"></script>
    <script src="/src/components/footer/footer.js"></script>

    <script type="module" src="/src/pages/login/ts/userprofile.ts"></script>
      
  </body>
</html>
