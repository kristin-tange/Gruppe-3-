<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logginn page</title>

    <!-- ROBOTO-FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Public+Sans:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/css/style.css" />
    <link rel="stylesheet" href="/src/css/profileandlogin.css" />

    <link
      rel="shortcut icon"
      href="/assets/icons/logo.png"
      type="image/x-icon"
    />
  </head>
  <body class="login-page">

    <header>  
    </header>
    <!-- Hero -->

    <main>
      <div class="account-page-wrapper">
        <div class="form-container">
          <h2>Logg inn</h2>
          <form id="accountForm">
            <div class="form-group">
              <label for="email">E-post</label>
              <input type="text" placeholder="E-post" id="email" required />
            </div>
            <div class="form-group">
              <label for="password">Passord</label>
              <input
                type="password"
                placeholder="Passord"
                id="password"
                required
              />
            </div>
            <div class="button-group">
              <button type="button" id="loginBtn" class="btn btn-primary">
                Logg inn
              </button>
              <button type="button" id="registrer" class="btn btn-secondary">
                Registrer deg
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>

    <footer> </footer>
     
   
      <script src="../../js/header.js" defer></script>
      <script src="../../js/burger.js" defer></script>
      <script src="../../js/login.js" defer></script>
      <script src="/src/js/footer.js" defer></script>
  
  </body>
</html>
