<!doctype html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/css/style.css" />
    <link rel="stylesheet" href="./contact.css" />
    <meta name="author" content="Oscar Wirum" />

    <!-- ROBOTO-FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Public+Sans:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="shortcut icon"
      href="./public/assets/icons/logo.png"
      type="image/x-icon"
    />
    <title>Gatherly</title>
  </head>
  <body>
    <header></header>

    <main>
      <section style="display: flex; justify-content: center; margin-top: 1rem">
        <h1>Kontakt oss gjerne om du har noen spørsmål!</h1>
      </section>
      <section class="contact-wrapper">
        <div class="contact-box social-media">
          <div>
            <a href="https://www.facebook.com" target="_blank">
              <img
                src="/Gatherly/public/assets/icons/contactPage/contactFacebook.png"
                alt="Facebook"
                class="icon"
              />
            </a>
          </div>
          <div>
            <a href="https://www.instagram.com" target="_blank">
              <img
                src="/Gatherly/public/assets/icons/contactPage/contactInstagram.png"
                alt="Instagram"
                class="icon"
              />
            </a>
          </div>
          <div>
            <a href="mailto:post@gatherly.no">
              <img
                src="/Gatherly/public/assets/icons/contactPage/contactEmail.png"
                alt="E-post"
                class="icon"
              />
            </a>
          </div>
        </div>
        <div class="contact-box">Hei</div>
      </section>
    </main>
    <footer></footer>
    <script src="/src/js/header.js"></script>
    <script src="/src/js/burger.js"></script>
  </body>
</html>
