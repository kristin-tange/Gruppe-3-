<!DOCTYPE html>
<html lang="nb">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Arrangementinformasjon" />
    <meta name="author" content="Kristin Tange" />
    <link rel="stylesheet" href="/src/css/style.css" />
    <link rel="stylesheet" href="/src/pages/singleEvent/singleEvent.css" />

    <!-- ROBOTO-FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Public+Sans:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />

    <title>Arrangementinformasjon</title>
  </head>
  <body>
    <header></header>

    <!-- HERO -->
    <div id="hero-container"></div>

    <main>
      <!-- EVENT-INFO -->
      <div id="description-container"></div>

      <!-- POSTS -->
      <section class="posts section-grid">
        <h3>Noe på hjertet?</h3>
        <p class="post-info">
          Skriv et innlegg til arrangøren eller andre som er interessert i dette
          arrangementet.
        </p>
        <button
          id="open-overlay-btn"
          class="btn btn-secondary"
          type="button"
          aria-label="Opprett innlegg"
        >
          <span id="create-post">Opprett innlegg</span>
          <img
            src="/public/assets/icons/pil.svg"
            id="arrow"
            alt="Opprett innlegg"
          />
        </button>

        <h4>Innlegg <span id="post-counter" class="highlight"></span></h4>

        <div id="post-container"></div>

        <!-- OVERLAY: CREATE POST  -->
        <aside id="post-overlay" aria-label="Opprett innlegg">
          <form id="post-form" class="form-container">
            <button
              id="close-btn"
              class="btn btn-secondary active"
              type="button"
              aria-label="Lukk vindu"
            >
              <img
                src="/public/assets/icons/close.png"
                alt="Lukk vindu"
                width="10px"
              />
            </button>
            <h3 id="form-heading">Opprett innlegg</h3>
            <div class="form-group">
              <label for="new-post-title">Tittel</label>
              <input
                type="text"
                id="new-post-title"
                name="post-name"
                placeholder="Skriv tittel på innlegg..."
                required
              />
            </div>
            <div class="form-group">
              <label for="new-post-txt">Ditt innlegg</label>
              <textarea
                id="new-post-txt"
                name="text"
                rows="6"
                placeholder="Skriv innlegg..."
                required
              ></textarea
              ><br />
            </div>
            <div class="button-group">
              <button
                id="publish-btn"
                class="btn btn-primary active"
                type="submit"
              >
                Publiser
              </button>
            </div>
          </form>
        </aside>
      </section>
    </main>

    <!-- FOOTER -->
    <footer></footer>

    <script type="module" src="/src/js/header.js"></script>
    <script type="module" src="/src/js/burger.js"></script>
    <script type="module" src="/src/js/footer.js"></script>

    <script
      type="module"
      src="/src/pages/singleEvent/js/singleEvent.js"
    ></script>
    <script type="module" src="/src/pages/singleEvent/js/api.js"></script>
    <script type="module" src="/src/pages/singleEvent/js/posts.js"></script>
    <script
      type="module"
      src="/src/pages/singleEvent/js/helperFunctions.js"
    ></script>
  </body>
</html>
