<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Opprett arrangement</title>

  <link rel="stylesheet" href="/src/css/style.css" />
  <link rel="stylesheet" href="/src/pages/createEvent/css/createEvent.css" />

  <!-- ROBOTO-FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Public+Sans:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
    rel="stylesheet"
  />

  <link
    rel="shortcut icon"
    href="/assets/icons/logo.png"
    type="image/x-icon"
  />
</head>

<body>
  <header></header>

  <main class="create-event-page">
    <form id="create-event-form" class="create-event-form">
      <input type="hidden" id="meetup-id" />

      <section class="form-section general-info-section">
        <div class="section-title-box">
          <h1>Opprett arrangement</h1>
        </div>

        <p id="event-status-message" aria-live="polite"></p>

        <div class="general-info-content">
          <div class="general-info-left">
            <label for="event-title">Navn på arrangement</label>
            <input type="text" 
              id="event-title" 
              name="event-title" 
              maxlength="50"
              required />

            <label for="short-description">Kort beskrivelse</label>
            <input
              type="text"
              id="short-description"
              name="short-description"
              maxlength="110"
              required
            />

            <div class="row-fields">
              <div class="field-group">
                <label for="category">Kategori</label>
                <select id="category" name="category" required>
                  <option value="">Velg kategori</option>
                  <option value="Academia">Academia</option>
                  <option value="Entertainment">Entertainment</option>
                  <option value="Professional">Professional</option>
                  <option value="Literature">Literature</option>
                  <option value="Technology">Technology</option>
                  <option value="Sports">Sports</option>
                </select>
              </div>

              <div class="field-group">
                <label for="price">Pris</label>
                <select id="price" name="price" required>
                  <option value="">Velg pris</option>
                  <option value="gratis inngang">gratis inngang</option>
                  <option value="100kr">100kr</option>
                  <option value="150kr">150kr</option>
                  <option value="200kr">200kr</option>
                  <option value="250kr">250kr</option>
                  <option value="300kr">300kr</option>
                  <option value="350kr">350kr</option>
                  <option value="400kr">400kr</option>
                  <option value="450kr">450kr</option>
                  <option value="500kr">500kr</option>
                </select>
              </div>
            </div>

            <div class="field-group">
              <label for="tags">Tags</label>
              <input
                type="text"
                id="tags"
                name="tags"
                placeholder="frontend, student, gratis"
                maxlength="50"
              />
            </div>
          </div>
        </div>
      </section>

      <section class="form-section time-location-section">
        <div class="section-title-box">
          <h2>Tid og lokasjon</h2>
        </div>

        <div class="time-location-content">
          <div class="row-fields">
            <div class="field-group">
              <label for="date">Dato</label>
              <input type="date" id="date" name="date" required />
            </div>

            <div class="field-group">
              <label for="time">Klokkeslett</label>
              <input type="time" id="time" name="time" required />
            </div>
          </div>

          <div class="field-group location-field">
            <label for="location">Lokasjon</label>
            <input type="text" id="location" name="location" maxlength="30" required />
          </div>
        </div>
      </section>

      <section class="form-section description-section">
        <div class="section-title-box">
          <h2>Beskrivelse</h2>
        </div>

        <label for="description" class="sr-only">Beskrivelse</label>
        <textarea
          id="description"
          name="description"
          rows="10"
          required
        ></textarea>
      </section>

      <section class="action-section">
        <button type="submit" id="submit-event-btn" class="publish-btn">
          Publiser
        </button>

        <button type="reset" id="reset-form-btn" class="icon-btn">
          Nullstill
        </button>
      </section>
    </form>

    <section class="existing-events-section">
      <h2>Eksisterende arrangementer</h2>
      <div id="meetups-list"></div>
    </section>
  </main>

  <footer></footer>

  <script src="/src/js/header.js"></script>
  <script src="/src/js/footer.js"></script>
  <script src="/src/js/burger.js"></script>
  <script src="/src/pages/createEvent/createEvent.js"></script>
</body>
</html>
